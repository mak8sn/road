services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: road
      POSTGRES_USER: road
      POSTGRES_PASSWORD: road
    volumes:
      - road_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U road -d road"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://road:road@db:5432/road
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
volumes:
  road_postgres:
