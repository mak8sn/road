services:
  db:
    build: ./db
    image: road-postgres:16
    environment:
      POSTGRES_DB: road
      POSTGRES_USER: road
      POSTGRES_PASSWORD: road
    volumes:
      - road_postgres:/var/lib/postgresql/data
      - ./data/backup:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U road -d road"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://road:road@db:5432/road
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: road-postgres:16
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: road
      PGPASSWORD: road
      PGDATABASE: road
    volumes:
      - ./data/backup:/backup
    depends_on:
      db:
        condition: service_healthy

volumes:
  road_postgres:
  frontend_node_modules:
